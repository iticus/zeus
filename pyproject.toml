[project]
name = "zeus"
version = "0.1.0"
description = "Weather app"
readme = "README.md"
authors = [
    { name = "iticus", email = "ticus.ionut@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
]

[project.scripts]
zeus = "zeus:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.49",
]
lint = [
    "ruff>=0.15.17",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages.find.where = [ "src" ]

[tool.uv]
default-groups = [ "dev" ]
sources.zeus= { path = ".", editable = true }

[tool.ruff]
line-length = 120
indent-width = 4
src = [ "src", "tests" ]
cache-dir = ".cache/.ruff_cache"
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"

[tool.pytest]
ini_options.pythonpath = "src"
ini_options.addopts = [
  "--import-mode=importlib",
  "--pythonwarnings=error",
]
ini_options.asyncio_mode = "auto"
ini_options.log_cli = true
ini_options.log_cli_level = "INFO"
ini_options.log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
